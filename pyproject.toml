[project]
name = "price-monitor"
version = "1.0.0"
description = "CLI-инструмент для мониторинга цен на маркетплейсах"
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["beautifulsoup4 >= 4.15.0", 
"lxml >= 6.1.3", 
"requests >= 2.34.2",
"pytest>=8.0.0"]

authors = [
    { name = "Зангиев Владислав / ch0rt1k555", email = "vlad.zangiyev.97@mail.ru" }
]


[project.urls]
Repository = "https://github.com/ch0rt1k555/Price-monitor"
"Bug Tracker" = "https://github.com/ch0rt1k555/Price-monitor/issues"
    


[project.license]
text = "MIT"


classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.scripts]
price_monitor = "price_monitor.cli:main"

[tool.uv.workspace]
members = [
    "pytest_tests",
    "pytest_tests/pytest_tests/pytest_tests",
]
