description = "CLI-инструмент для мониторинга цен на маркетплейсах"
readme = "README.md"
requires-python = ">=3.8"


authors = [
    { name = "Зангиев Владислав / ch0rt1k555", email = "vlad.zangiyev.97@mail.ru" }
]

